<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studies</title>
    <!-- <link rel="stylesheet" href="stylesheet.css"> -->

    <style>
        /* ---------- Base page styles ---------- */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* ---------- Header ---------- */
        header {
            background-color: #1a1a1a;
            padding: 20px;
            border-bottom: 2px solid #cc0000;
        }

        header h1,
        header h2 {
            color: #ffffff;
        }

        /* ---------- Nav links ---------- */
        nav a {
            display: inline-block;
            text-decoration: none;
            background-color: #272727;
            color: #ffffff;
            padding: 10px 18px;
            margin: 8px;
            border-radius: 20px;

        }

        nav a:hover {
            background-color: #cc0000;
        }

        /* ---------- Go Back button ---------- */
        nav button {
            padding: 10px 20px;
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button:hover {
            background-color: #a30000;
        }

        /* ---------- Main content area ---------- */
        main {
            padding: 30px 20px;
        }

        /* ---------- Video boxes ---------- */
        .video-box {
            display: inline-block;
            background-color: #1a1a1a;
            padding: 10px;
            margin: 15px;
            border-radius: 10px;
        }

        .video-box iframe {
            border-radius: 8px;
        }

        /* ---------- Footer ---------- */
        footer {
            background-color: #1a1a1a;
            padding: 15px;
            color: #888;
            border-top: 2px solid #cc0000;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
        }

        h3 {
            padding: 6px;
        }

        .leclink {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
</head>

<body>
    <header>
