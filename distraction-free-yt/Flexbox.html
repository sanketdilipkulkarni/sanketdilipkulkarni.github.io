<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            display: flex;
            height: 60px;
            justify-content: space-between;
            padding: 14px;
            border: 4px solid;
            border-radius: 8px;
            border-color: red;
            background-color: black;
            color: white;
        }

        .logo {
            border: 4px solid rgb(35, 207, 255);
            height: 30px;
            border-radius: 4px;
            padding: 6px;
            font-weight: 700;
            font-style: italic;
            display: flex;
            align-items: center;
        }

        .link {
            display: flex;
            gap: 80px;
            align-items: center;
        }

        a {
            color: white;
            font-weight: 1000;
        }
        img{
            height: 100%;
            width: 100%;
            object-fit: cover;
            background-color: white;
        }
    </style>
</head>

<body>
    <header>
        <nav class="container">
            <div class="logo">
              <img src="https://i.pinimg.com/474x/76/bf/92/76bf929f50301acec6eaa8a7eeb5a21a.jpg" alt="Img">
            </div>
            <div class="link">
                <a href="#">Home</a>
                <a href="#">Index</a>
                <a href="#">Contact</a>
                <a href="#">Info</a>
            </div>
        </nav>
    </header>
</body>

</html>
